<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <!-- Phone setup: fill the screen, no pinch-zoom, run full screen when added to the Home Screen. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Fur Stop">
    <meta name="theme-color" content="#bfe3fa">
    <title>Fur Stop</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #bfe3fa; overflow: hidden;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      /* On a phone the game fills the screen. On a computer it shows as a tall phone-shaped box. */
      #game { position: fixed; inset: 0; margin: auto; width: 100%; height: 100%; }
      @media (min-aspect-ratio: 3/4) {
        #game { height: 100%; width: auto; aspect-ratio: 9 / 16; }
      }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #bfe3fa; outline: none; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px; color: #26334f;
      }
      #loading h1 { margin: 0; font-size: 34px; }
      #bar { width: 60%; max-width: 280px; height: 14px; border-radius: 7px; background: #ffffff99; overflow: hidden; }
      #fill { width: 0%; height: 100%; background: #ff8c40; border-radius: 7px; transition: width 0.2s; }
      #note { font-size: 15px; opacity: 0.7; padding: 0 24px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="game"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading">
      <h1>Fur Stop</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="note">Loading the shelter...</div>
    </div>
    <script src="Build/3ea760b84ffe48d36280232f59de6002.loader.js"></script>
    <script>
      // Stop iPhone Safari from scrolling or zooming the page when the player taps quickly.
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/a1b2b68bf136968e9dd9de37de6b0cdc.data.unityweb",
        frameworkUrl: "Build/39f1e242bd29ad5f77833bb100c03f94.framework.js.unityweb",
        codeUrl: "Build/28751bfc8267042949d1e90a6ff641f5.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Shepps Productions",
        productName: "Fur Stop",
        productVersion: "0.1.0",
      }, function (progress) {
        document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
      }).catch(function (message) {
        document.querySelector("#note").textContent = "Sorry, the game couldn't start: " + message;
      });
    </script>
  </body>
</html>
